<h2>My Tasks</h2>

<p>Total tasks: {{ tasks.length }}</p>

@if (message) {
  <p class="message">{{ message }}</p>
}

@for (task of tasks; track task.id) {
  <div class="task-item" [class.done]="task.completed">

    <span class="task-title">
      {{ task.id }} — {{ task.title }}
    </span>

    <div class="task-actions">

      <!-- PATCH -->
      <button class="btn-patch" (click)="toggleComplete(task)">
        {{ task.completed ? '↩️ Undo' : '✅ Complete' }}
      </button>

      <!-- ✏️ Edit — pre-fills the form above -->
      <button class="btn-edit" (click)="requestEdit(task)">
        ✏️ Edit
      </button>

      <!-- DELETE -->
      <button class="btn-delete" (click)="deleteTask(task.id)">
        🗑️ Delete
      </button>

    </div>
  </div>
}
